<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant DSL Lab</title><link rel="stylesheet" href="/static/ui.css"><script defer src="/static/ui.js"></script><script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script><style>
:root{--bg:#0d1016;--panel:#151925;--line:#2a3040;--text:#edf0f6;--muted:#929aad;--blue:#4e7ff0;--green:#3dac7c;--red:#d9534f;--amber:#d99b35}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-columns:270px 1fr}.sidebar{background:#121620;border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;min-height:0}.brand{padding:17px;font-size:18px;font-weight:800;border-bottom:1px solid var(--line)}.tree{overflow:auto;padding:10px}.cat{margin-bottom:5px}.cat-title,.artifact{display:flex;align-items:center;gap:7px;padding:8px;border-radius:6px;cursor:pointer}.cat-title{font-weight:700}.cat-title.active,.artifact.active{background:#283149}.artifact{margin-left:19px;color:#b8c0d0}.artifact:hover,.cat-title:hover{background:#202637}.status-dot{width:7px;height:7px;border-radius:50%;background:#43b883}.tree-tools{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}.tree-tools button{font-size:12px;padding:7px}.main{min-width:0;display:grid;grid-template-rows:auto 355px 1fr}.top{height:58px;padding:10px 14px;display:flex;align-items:center;gap:8px;background:#141824;border-bottom:1px solid var(--line)}.title{flex:1;height:36px}.control{background:#202534;color:var(--text);border:1px solid #30384b;border-radius:6px;padding:8px}.badge{padding:7px 10px;border-radius:15px;background:#2a303d;color:var(--muted)}.badge.ok{background:#153c30;color:#70d6ac}.badge.fail{background:#46231f;color:#ff8f88}button{border:0;border-radius:6px;padding:9px 13px;background:#343c50;color:white;cursor:pointer;font-weight:650}button:disabled{opacity:.38}.primary{background:var(--blue)}.success{background:var(--green)}.danger{background:var(--red)}.prompt-workspace{display:grid;grid-template-columns:1fr 1fr 310px;min-height:0;border-bottom:1px solid var(--line)}.pane{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}.pane-head{height:38px;padding:10px 12px;background:#171c27;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}.editor{flex:1;background:#0f1219;color:#e8ebf2;border:0;outline:0;resize:none;padding:12px;font:13px/1.5 Consolas,monospace}.request{height:85px;border-bottom:1px solid var(--line)}.side{display:grid;grid-template-rows:auto auto 1fr;background:#11151e}.side-actions{padding:10px;display:grid;gap:7px}.side-actions button{width:100%}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px}.metric{padding:8px;background:#1c212d;border-radius:6px}.metric small{display:block;color:var(--muted)}.metric b{line-height:26px}#log{border-top:1px solid var(--line);padding:10px;overflow:auto;white-space:pre-wrap;font:12px/1.45 Consolas;color:#aab2c3}.chart-area{min-height:0;display:grid;grid-template-rows:auto auto 1fr}.chart-tools,.legend{height:42px;padding:6px 12px;background:#151a24;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.chart-tools .control{padding:6px}.chart-tools details{margin-left:auto}.legend button{padding:5px 8px;font-weight:500}.legend button.off{opacity:.35}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}#chart{min-height:0}details.diagnostic{position:absolute;right:15px;top:62px;width:520px;z-index:10;background:#202534;border:1px solid var(--line);padding:8px;border-radius:7px}#diagnostic{height:250px;width:100%;margin-top:7px}.source-box{display:none}.source-box.open{display:block;position:absolute;left:280px;top:62px;z-index:9;width:540px;padding:10px;background:#202534;border:1px solid var(--line);border-radius:7px}.source-box textarea{width:100%;height:170px}@media(max-width:1150px){.prompt-workspace{grid-template-columns:1fr 1fr}.side{display:none}.app{grid-template-columns:230px 1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Quant DSL Lab</div><div id="tree" class="tree"></div><div class="tree-tools"><button id="add-category">+ 분류</button><button id="rename-category">이름변경</button><button id="new-artifact">+ 새 결과물</button><button id="delete-node" class="danger">삭제</button></div></aside><main class="main"><header class="top"><input id="artifact-name" class="control title" placeholder="결과물 제목"><select id="source-type" class="control"><option value="NATURAL_LANGUAGE">자연어</option><option value="KIWOOM">키움 수식</option><option value="PINESCRIPT">Pine Script</option><option value="OTHER">기타 소스</option></select><button id="source-toggle">원본 소스</button><span id="playbook" class="badge">Playbook 확인 중</span><span id="status" class="badge">요청 대기</span><details class="diagnostic"><summary>개발자 진단</summary><textarea id="diagnostic" class="editor" readonly></textarea></details></header>
<section class="prompt-workspace"><div class="pane"><div class="pane-head"><span>개선 요청</span><button id="generate" class="primary">전달 프롬프트 생성</button></div><textarea id="request" class="editor request" placeholder="예: 횡보 구간에서는 진입하지 않고 청산 후 10봉 동안 재진입하지 않게 개선해 주세요."></textarea><div class="pane-head"><span>외부 LLM 전달 내용</span><button id="copy-prompt">복사</button></div><textarea id="prompt" class="editor" readonly placeholder="요청을 입력하고 전달 프롬프트를 생성하세요."></textarea></div><div class="pane"><div class="pane-head"><span>LLM 응답 등록</span><button id="paste-response">붙여넣기</button></div><textarea id="response" class="editor" placeholder="외부 LLM의 응답 전체를 붙여넣으세요. 코드 블록은 자동 추출됩니다."></textarea></div><aside class="side"><div class="side-actions"><button id="validate" class="primary">검증/차트삽입</button><button id="save" class="success" disabled>적용·저장</button><button id="discard" disabled>후보 폐기</button></div><div class="metrics"><div class="metric"><small>총 수익률</small><b id="m-return">-</b></div><div class="metric"><small>MDD</small><b id="m-mdd">-</b></div><div class="metric"><small>승률</small><b id="m-winrate">-</b></div><div class="metric"><small>거래 횟수</small><b id="m-trades">-</b></div></div><div id="log">왼쪽에서 결과물을 선택하거나 새 결과물을 만드세요.</div></aside></section>
<section class="chart-area"><div class="chart-tools"><select id="data-source" class="control"><option value="synthetic">샘플 데이터</option><option value="kiwoom">키움 REST</option></select><select id="symbol" class="control"><option value="005930">005930 삼성전자</option><option value="000660">000660 SK하이닉스</option><option value="035420">035420 NAVER</option></select><select id="timeframe" class="control"><option>1m</option><option>3m</option><option selected>5m</option><option>15m</option><option>30m</option><option>60m</option><option>1d</option></select><span id="rest" class="badge">REST</span><span id="wss" class="badge">WSS</span></div><div class="legend"><span><i class="dot" style="background:#26a69a"></i>캔들/매매</span><span id="toggles"></span></div><div id="chart"></div></section></main></div><div id="source-box" class="source-box"><select id="source-format" class="control"><option value="KIWOOM">키움 수식</option><option value="PINESCRIPT">Pine Script</option><option value="OTHER">기타</option></select><textarea id="source-code" class="editor" placeholder="필요한 경우 변환할 원본 소스를 붙여넣으세요."></textarea></div>
<script>
const el=id=>document.getElementById(id);let treeData={categories:[],artifacts:[],types:{}},selectedCategory=null,current=null,candidate=null,chart,candles;const seriesMap=new Map(),palette=['#4e7ff0','#e8a43c','#8b5cf6','#ec4899','#22d3ee'];
function say(text,type=''){el('log').textContent=`[${new Date().toLocaleTimeString('ko-KR',{hour12:false})}] ${text}`;el('log').style.color=type==='error'?'#ff8f88':type==='ok'?'#70d6ac':'#aab2c3'}function status(text,type=''){el('status').textContent=text;el('status').className=`badge ${type}`}
function initChart(){const box=el('chart');chart=LightweightCharts.createChart(box,{width:box.clientWidth,height:box.clientHeight,layout:{background:{color:'#0d1016'},textColor:'#929aad'},grid:{vertLines:{color:'#1a1f2a'},horzLines:{color:'#1a1f2a'}},timeScale:{timeVisible:true}});candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});addEventListener('resize',()=>chart.applyOptions({width:box.clientWidth,height:box.clientHeight}))}
function renderChart(data){candles.setData(data.candles||[]);if(candles.setMarkers)candles.setMarkers(data.markers||[]);seriesMap.forEach(s=>chart.removeSeries(s));seriesMap.clear();el('toggles').innerHTML='';(data.indicators||[]).forEach((item,i)=>{const color=palette[i%palette.length],s=chart.addLineSeries({color,lineWidth:2,title:item.name,priceLineVisible:false,priceScaleId:item.overlay===false?`scale-${i}`:'right'});s.setData(item.data||[]);seriesMap.set(item.name,s);const b=document.createElement('button'),dot=item.direction_colored?'linear-gradient(90deg,#10b981 50%,#ef5350 50%)':color;b.innerHTML=`<i class="dot" style="background:${dot}"></i>${item.name}`;b.onclick=()=>{const off=b.classList.toggle('off');s.applyOptions({visible:!off})};el('toggles').appendChild(b)});chart.timeScale().fitContent();el('m-return').textContent=data.metrics.total_return;el('m-mdd').textContent=data.metrics.mdd;el('m-winrate').textContent=data.metrics.win_rate;el('m-trades').textContent=data.metrics.trade_count}
async function loadTree(){treeData=await (await fetch('/api/tree')).json();const root=el('tree');root.innerHTML='';const draw=parent=>treeData.categories.filter(c=>c.parent_id===parent).forEach(c=>{const box=document.createElement('div');box.className='cat';const h=document.createElement('div');h.className=`cat-title ${selectedCategory===c.id?'active':''}`;h.textContent=`▾ ${c.name}`;h.onclick=()=>{selectedCategory=c.id;current=null;loadTree();newArtifact(false)};box.appendChild(h);treeData.artifacts.filter(a=>a.category_id===c.id).forEach(a=>{const n=document.createElement('div');n.className=`artifact ${current&&current.id===a.id?'active':''}`;n.innerHTML=`<i class="status-dot"></i>${a.name}`;n.onclick=()=>selectArtifact(a);box.appendChild(n)});root.appendChild(box);draw(c.id)});draw(null);if(!selectedCategory&&treeData.categories.length)selectedCategory=treeData.categories[0].id}
function selectArtifact(a){current=a;candidate=null;selectedCategory=a.category_id;el('artifact-name').value=a.name;el('request').value=a.user_request||'';el('response').value=a.llm_response||'';el('prompt').value=a.prompt_text||'';el('source-code').value=a.source_code&&a.source_code!==a.dsl_code?a.source_code:'';el('source-type').value=a.source_type==='KIWOOM'||a.source_type==='PINESCRIPT'||a.source_type==='OTHER'?a.source_type:'NATURAL_LANGUAGE';if(el('artifact-type'))el('artifact-type').value=a.artifact_type||'strategy';el('diagnostic').value=`현재 검증 DSL\n${a.dsl_code}`;el('save').disabled=true;el('discard').disabled=true;status('현재 적용본','ok');loadTree();say(`${a.name}의 마지막 요청·프롬프트·응답을 복원했습니다.`)}
function newArtifact(clear=true){current=null;candidate=null;if(clear){el('artifact-name').value='';el('request').value='';el('response').value='';el('prompt').value='';el('source-code').value=''}el('diagnostic').value='';el('save').disabled=true;el('discard').disabled=true;status('신규 후보');say('새 결과물의 요청을 작성하세요.')}
function currentType(){const picker=el('artifact-type');if(picker)return picker.value;const c=treeData.categories.find(x=>x.id===selectedCategory);return c?c.artifact_type:'strategy'}
async function generatePrompt(previous=''){const requirement=el('request').value.trim()||'첨부된 검증·성과 분석을 바탕으로 현재 전략의 병목과 위험 대비 성과를 구조적으로 개선해 주세요.';const analysisContext=previous||(candidate?.analysis?JSON.stringify(candidate.analysis,null,2):'');const body={artifact_id:current?.id||null,artifact_type:currentType(),user_request:requirement,current_dsl:candidate?.dsl_code||current?.dsl_code||'',source_type:el('source-type').value,source_code:el('source-code').value,previous_error:analysisContext};const d=await (await fetch('/api/llm/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();el('request').value=requirement;el('prompt').value=d.prompt;el('playbook').textContent=`Playbook ${d.playbook_version} · ${d.playbook_hash.slice(0,8)}`;el('generate').textContent='개선 프롬프트 다시 생성';say(candidate?.analysis?'현재 후보 DSL과 성과 분석을 포함한 다음 개선 프롬프트를 생성했습니다.':'외부 LLM 전달 프롬프트를 생성했습니다.','ok')}
async function validate(){if(!el('response').value.trim()){say('LLM 응답을 붙여넣으세요.','error');return}status('검증 중');el('validate').disabled=true;const body={artifact_id:current?.id||null,artifact_type:currentType(),user_request:el('request').value,prompt_text:el('prompt').value,current_dsl:candidate?.dsl_code||current?.dsl_code||'',source_type:el('source-type').value,source_code:el('source-code').value,llm_response:el('response').value,data_source:el('data-source').value,symbol:el('symbol').value,timeframe:el('timeframe').value,settings:{total_capital:10000000,allocation_pct:100}};try{const d=await (await fetch('/api/llm/validate-chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();el('diagnostic').value=JSON.stringify(d.diagnostic,null,2)+(d.dsl_code?`\n\n추출 DSL\n${d.dsl_code}`:'');if(!d.valid){candidate=null;el('save').disabled=true;el('discard').disabled=false;if(d.status==='data_error'){status('키움 데이터 연결 실패','fail');say(`${d.diagnostic.message}\nDSL은 수정하지 않았습니다. REST 연결을 확인한 뒤 다시 검증하세요.`,'error');return}el('prompt').value=d.repair_prompt||el('prompt').value;status('DSL 검증 실패','fail');say(`${d.diagnostic.message}\n수정용 전달 프롬프트를 생성했습니다.`,'error');return}candidate=d;renderChart(d.chart);el('save').disabled=false;el('discard').disabled=false;el('generate').textContent='분석결과로 개선 프롬프트';status('검증/차트 성공','ok');const issues=(d.analysis?.issues||[]).join('\n- ');say(`검증 후보를 차트에 적용했습니다.\n- ${issues}\n필요하면 분석결과로 개선 프롬프트를 생성하세요.`,'ok')}finally{el('validate').disabled=false}}
async function saveCandidate(){if(!candidate)return;const root=treeData.categories.find(x=>x.artifact_type===currentType()&&x.parent_id===null);if(root)selectedCategory=root.id;if(!selectedCategory){say('결과물 종류를 선택하세요.','error');return}const name=el('artifact-name').value.trim();if(!name){say('결과물 제목을 입력하세요.','error');return}const body={artifact_id:current?.id||null,name,description:'',category_id:selectedCategory,artifact_type:currentType(),source_type:el('source-type').value,source_code:el('source-code').value,user_request:el('request').value,prompt_text:el('prompt').value,llm_response:el('response').value,dsl_code:candidate.dsl_code,validation:candidate.diagnostic};const r=await fetch('/api/artifacts/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok){say(d.detail||'저장 실패','error');return}await loadTree();const saved=treeData.artifacts.find(x=>x.id===d.id);if(saved)selectArtifact(saved);say('요청·전달 프롬프트·LLM 응답·DSL을 버전 파일로 저장했습니다.','ok')}
async function addCategory(){const name=prompt('새 분류 이름');if(!name)return;const type=prompt('종류: indicator, signal, strength, strategy, drawing',currentType())||currentType();await fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,artifact_type:type,parent_id:null})});await loadTree()}async function renameCategory(){if(!selectedCategory)return;const c=treeData.categories.find(x=>x.id===selectedCategory),name=prompt('분류 이름',c.name);if(!name)return;await fetch(`/api/categories/${c.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...c,name})});await loadTree()}async function deleteNode(){if(current){if(confirm('선택 결과물을 삭제할까요?')){await fetch(`/api/strategies/${current.id}`,{method:'DELETE'});newArtifact();await loadTree()}}else if(selectedCategory&&confirm('빈 분류만 삭제할 수 있습니다. 삭제할까요?')){const r=await fetch(`/api/categories/${selectedCategory}`,{method:'DELETE'}),d=await r.json();if(!r.ok)say(d.detail,'error');else{selectedCategory=null;await loadTree()}}}
async function connectivity(){try{const d=await (await fetch('/api/kiwoom/connectivity')).json();[['rest',d.rest],['wss',d.wss]].forEach(([id,v])=>{el(id).textContent=`${id.toUpperCase()} ${v.connected?'연결':'실패'}`;el(id).className=`badge ${v.connected?'ok':'fail'}`})}catch{}}
el('generate').onclick=()=>generatePrompt();el('copy-prompt').onclick=()=>navigator.clipboard.writeText(el('prompt').value);el('paste-response').onclick=async()=>el('response').value=await navigator.clipboard.readText();el('validate').onclick=validate;el('save').onclick=saveCandidate;el('discard').onclick=()=>{candidate=null;el('save').disabled=true;el('discard').disabled=true;status(current?'현재 적용본':'신규 후보');say('검증 후보를 폐기했습니다.')};el('new-artifact').onclick=()=>newArtifact();el('add-category').onclick=addCategory;el('rename-category').onclick=renameCategory;el('delete-node').onclick=deleteNode;el('source-toggle').onclick=()=>el('source-box').classList.toggle('open');el('source-type').onchange=()=>{el('source-format').value=el('source-type').value};initChart();loadTree();connectivity();fetch('/api/playbook').then(r=>r.json()).then(d=>el('playbook').textContent=`Playbook ${d.version} · ${d.hash.slice(0,8)}`);
</script></body></html>
