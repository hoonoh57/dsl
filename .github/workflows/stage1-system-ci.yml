name: stage1-system-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Core regression
        run: python -m unittest -v test_core.py
      - name: Stage1 contracts
        run: python -m unittest -v test_stage1_factory.py test_stage1_extended.py test_stage1_chart_boundary.py test_stage1_execution_golden.py test_stage1_completion_contracts.py test_stage1_stack_launcher.py test_stage1_streaming_parity.py test_stage1_capability_boundary.py
      - name: Stage1 quick stress
        run: python stage1_stress.py
