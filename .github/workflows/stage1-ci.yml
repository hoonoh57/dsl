name: stage1-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Existing core regression
        run: python -m unittest -v test_core.py
      - name: Stage 1 contracts
        run: python -m unittest -v test_stage1_factory.py test_stage1_extended.py test_stage1_chart_boundary.py test_stage1_execution_golden.py test_stage1_completion_contracts.py test_stage1_stack_launcher.py test_stage1_streaming_parity.py test_stage1_capability_boundary.py test_stage1_verifier.py
