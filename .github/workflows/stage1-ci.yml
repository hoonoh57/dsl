name: stage1-ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q .
      - name: Existing core regression
        run: python -m unittest -v test_core.py
      - name: Stage 1 contracts
        run: python -m unittest discover -v -p 'test_stage1_*.py'
