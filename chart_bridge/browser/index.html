<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Condition1516 Chart Platform · DSL</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d141b;color:#dbe7f2;font-family:Arial,"Noto Sans KR",sans-serif}body{overflow:hidden}#chart-platform-shell{height:100vh;display:grid;grid-template-rows:auto 1fr}.platform-head{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #27394a;background:#0e1821}.platform-head strong{letter-spacing:.06em}.platform-head span{font-size:11px;color:#8296a8}.platform-badge{margin-left:auto;padding:4px 7px;border:1px solid #31516a;border-radius:999px;font-size:10px;color:#9fc8e7}#market-chart-host{min-height:0;height:100%;overflow:hidden}.chart-context-menu{position:fixed;z-index:4000;min-width:260px;max-width:520px;padding:6px;border:1px solid #36506a;border-radius:6px;background:#111d28;box-shadow:0 12px 34px rgba(0,0,0,.45);color:#dbe7f2}.context-menu-item,.context-mini-button,.addon-picker-item{border:1px solid #334b60;background:#172635;color:#dbe7f2;border-radius:4px;cursor:pointer}.context-menu-item{display:block;width:100%;padding:7px 9px;text-align:left;margin:2px 0}.context-separator{height:1px;margin:6px 0;background:#2a3e51}.context-addon-row{display:grid;grid-template-columns:minmax(100px,1fr) repeat(4,auto);gap:4px;align-items:center;padding:4px 2px}.context-addon-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.context-mini-button{padding:4px 6px;font-size:10px}.chart-addon-dialog{width:min(520px,calc(100vw - 32px));max-height:80vh;border:1px solid #36506a;border-radius:8px;background:#111d28;color:#dbe7f2;padding:14px}.chart-addon-dialog::backdrop{background:rgba(0,0,0,.55)}.chart-addon-dialog input,.chart-addon-dialog select{width:100%;box-sizing:border-box;background:#172635;color:#dbe7f2;border:1px solid #36506a;border-radius:4px;padding:7px}.dialog-head{font-weight:700}.dialog-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}.dialog-actions button{padding:6px 10px;border:1px solid #36506a;border-radius:4px;background:#172635;color:#dbe7f2}.dialog-actions .primary{background:#214a6b}.addon-picker-list{display:grid;gap:5px;max-height:48vh;overflow:auto;margin:10px 0}.addon-picker-item{padding:8px;text-align:left}.addon-property-grid{display:grid;gap:7px;max-height:55vh;overflow:auto;margin:10px 0}.property-row{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.property-name{font-size:11px;color:#aebfce}</style></head>
<body><main id="chart-platform-shell"><header class="platform-head"><strong>CONDITION1516 CHART</strong><span>Chart Core · Bridge/Runtime · Add-ons · JSON State</span><span class="platform-badge">DSL STRATEGY ENABLED</span></header><section id="market-chart-host" aria-label="Market Chart"></section></main>
<div id="chart-context-menu" class="chart-context-menu" hidden></div><dialog id="addon-picker-dialog" class="chart-addon-dialog"><div class="dialog-head">Add Add-on</div><input id="addon-picker-search" type="search" placeholder="Add-on 검색" autocomplete="off"/><div id="addon-picker-list" class="addon-picker-list"></div><div class="dialog-actions"><button id="addon-picker-close" type="button">닫기</button></div></dialog><dialog id="addon-properties-dialog" class="chart-addon-dialog"><div id="addon-properties-title" class="dialog-head">Add-on Properties</div><div id="addon-property-grid" class="addon-property-grid"></div><div class="dialog-actions"><button id="addon-properties-cancel" type="button">취소</button><button id="addon-properties-save" type="button" class="primary">저장</button></div></dialog><script type="module" src="/__dsl/bootstrap.mjs"></script></body></html>
